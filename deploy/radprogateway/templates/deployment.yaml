apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  replicas: 1
  strategy:
    # Der alte Pod wird erst beendet, wenn der neue bereit ist.
    # Währenddessen greifen kurz beide auf das serielle Gerät zu.
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
      annotations:
        # Pod-Neustart bei Änderung von Broker/Topic/Schnittstelle
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: radprogateway
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-config
          # Bereit erst, wenn einmal erfolgreich gelesen und gesendet wurde (nach ca. 60 s)
          readinessProbe:
            exec:
              command:
                - test
                - -f
                - /tmp/heartbeat
            initialDelaySeconds: 60
            periodSeconds: 5
          # Neustart, wenn länger nicht erfolgreich gelesen und an den Broker gesendet wurde
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - "import os,time,sys; sys.exit(time.time()-os.path.getmtime('/tmp/heartbeat') > 180)"
            initialDelaySeconds: 150
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 2
          securityContext:
            privileged: true   # Host-Geräte (serielle Schnittstelle) sind im Container sichtbar
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
