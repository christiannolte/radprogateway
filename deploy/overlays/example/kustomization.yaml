apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: radprogateway
resources:
  - ../../base
images:
  - name: docker.io/christiannolte/radprogateway
    newTag: latest
configMapGenerator:
  - name: radprogateway-config
    behavior: merge
    literals:
      - BROKER=mqtt.example.org
      - TOPIC=example/topic
      - SERIAL_PORT=/dev/ttyUSB0
