apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
configMapGenerator:
  - name: radprogateway-config
    literals:
      # Dummy-Werte – müssen im Overlay bzw. in ArgoCD überschrieben werden
      - BROKER=CHANGE_ME
      - TOPIC=CHANGE_ME
      - SERIAL_PORT=CHANGE_ME
generatorOptions:
  disableNameSuffixHash: false   # Änderung an Broker/Topic löst Pod-Neustart aus
