apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: radprogateway
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/christiannolte/radprogateway.git
    targetRevision: main
    path: deploy/radprogateway
    helm:
      # Dummy-Werte aus values.yaml hier durch die echten ersetzen
      valuesObject:
        config:
          broker: CHANGE_ME
          topic: CHANGE_ME
          serialPort: CHANGE_ME
  destination:
    server: https://kubernetes.default.svc
    namespace: radprogateway
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
